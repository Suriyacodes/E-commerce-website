<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login |  PRABU ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">

  <div class="bg-[#111] p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>
    <input id="login-username" type="text" placeholder="Username" class="w-full mb-4 p-2 rounded bg-black border border-white text-white">
    <input id="login-password" type="password" placeholder="Password" class="w-full mb-4 p-2 rounded bg-black border border-white text-white">
    <button onclick="login()" class="w-full bg-red-600 hover:bg-red-800 text-white py-2 rounded">Login</button>
    <p class="text-sm mt-4 text-center">Don't have an account? <a href="signup.html" class="text-red-400 underline">Sign up</a></p>
  </div>

  <script>
    function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const stored = JSON.parse(localStorage.getItem('user'));
      if (!stored) return alert('No user found. Please sign up.');

      if (stored.username === username && stored.password === password) {
        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('loggedUser', username);
        alert('Login successful!');
        window.location.href = 'index.html';
      } else {
        alert('Invalid credentials!');
      }
    }
  </script>

</body>
</html>
