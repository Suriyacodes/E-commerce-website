<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart | PRABU ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: black;
      color: white;
      background-image: url('bg3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .cart-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="bg-black bg-opacity-80 p-4 sticky top-0 z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Suriya ShopCart</h1>
      <nav class="space-x-4">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
        <a href="overview.html">Overview</a>
        <span id="auth-links" class="ml-4"></span>
      </nav>
    </div>
  </header>

  <!-- Welcome -->
  <div id="welcome" class="text-right px-6 py-2 text-white"></div>

  <!-- Cart Content -->
  <main class="container mx-auto px-4 py-10">
    <h2 class="text-4xl font-bold mb-8 text-center">Your Cart 🛒</h2>
    <div id="cart-items" class="space-y-6"></div>
    <div id="cart-total" class="text-right mt-6 text-2xl font-semibold"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-black bg-opacity-80 text-white text-center py-4 mt-auto">
    &copy; 2025 Suriya ShopCart. All rights reserved.
  </footer>

  <script>
    const user = localStorage.getItem('loggedUser');
    const authLinks = document.getElementById('auth-links');
    const welcome = document.getElementById('welcome');

    if (localStorage.getItem('loggedIn') === 'true' && user) {
      welcome.innerHTML = `🛒 Hello, <strong>${user}</strong>`;
      authLinks.innerHTML = `<button onclick="logout()" class="bg-red-600 px-3 py-1 rounded hover:bg-red-800">Logout</button>`;
    } else {
      welcome.innerHTML = '';
      authLinks.innerHTML = `
        <a href="login.html" class="text-red-400 underline">Login</a>
        <a href="signup.html" class="text-red-400 underline ml-2">Sign Up</a>
      `;
    }

    function logout() {
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('loggedUser');
      location.reload();
    }

    const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
    const cartContainer = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');

    function displayCart() {
      cartContainer.innerHTML = "";
      let total = 0;

      if (cartItems.length === 0) {
        cartContainer.innerHTML = "<p class='text-center text-xl'>Your cart is empty.</p>";
        cartTotal.innerHTML = "";
        return;
      }

      cartItems.forEach((item, index) => {
        total += item.price;
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-[#111] p-4 rounded shadow";
        div.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${item.image}" alt="${item.name}" class="cart-img">
            <div>
              <h3 class="text-xl font-semibold">${item.name}</h3>
              <p>$${item.price.toFixed(2)}</p>
            </div>
          </div>
          <button onclick="removeItem(${index})" class="bg-red-600 px-4 py-2 rounded hover:bg-red-800">Remove</button>
        `;
        cartContainer.appendChild(div);
      });

      cartTotal.innerHTML = `Total: $${total.toFixed(2)}`;
    }

    function removeItem(index) {
      cartItems.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cartItems));
      displayCart();
    }

    displayCart();
  </script>
</body>
</html>
