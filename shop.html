<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop | PRABU ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: black;
      background-image: url('bg3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      object-position: center;
      background-color: #222;
      padding: 10px;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="text-white flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="bg-black bg-opacity-80 p-4 sticky top-0 z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Suriya ShopCart</h1>
      <nav class="space-x-4">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
        <a href="overview.html">Overview</a>
        <span id="auth-links" class="ml-4"></span>
      </nav>
    </div>
  </header>

  <!-- Welcome Message -->
  <div id="welcome" class="text-right px-6 py-2 text-white"></div>

  <!-- Products -->
  <main class="container mx-auto px-4 py-10">
    <h2 class="text-4xl font-bold mb-8 text-center">Shop Products</h2>
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-black bg-opacity-80 text-white text-center py-4 mt-auto">
    &copy; 2025 Suriya ShopCart. All rights reserved.
  </footer>

  <script>
    const user = localStorage.getItem('loggedUser');
    const authLinks = document.getElementById('auth-links');
    const welcome = document.getElementById('welcome');

    if (localStorage.getItem('loggedIn') === 'true' && user) {
      welcome.innerHTML = `🛍️ Welcome, <strong>${user}</strong>`;
      authLinks.innerHTML = `<button onclick="logout()" class="bg-red-600 px-3 py-1 rounded hover:bg-red-800">Logout</button>`;
    } else {
      welcome.innerHTML = '';
      authLinks.innerHTML = `
        <a href="login.html" class="text-red-400 underline">Login</a>
        <a href="signup.html" class="text-red-400 underline ml-2">Sign Up</a>
      `;
    }

    function logout() {
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('loggedUser');
      location.reload();
    }

    const products = [
      { name: "Wireless Headphones", price: 59.99, image: "product1.jpg" },
      { name: "Smartwatch", price: 79.99, image: "product2.jpg" },
      { name: "Bluetooth Speaker", price: 49.99, image: "product3.jpg" },
      { name: "Fitness Tracker", price: 39.99, image: "product4.jpg" },
      { name: "Phone Stand", price: 14.99, image: "product5.jpg" },
      { name: "Power Bank", price: 29.99, image: "product6.jpg" },
      { name: "Laptop Sleeve", price: 24.99, image: "product7.jpg" },
      { name: "USB-C Hub", price: 34.99, image: "product8.jpg" },
      { name: "Wireless Mouse", price: 19.99, image: "product9.jpg" },
      { name: "Gaming Keyboard", price: 89.99, image: "product10.jpg" },
    ];

    const productList = document.getElementById('product-list');
    products.forEach(product => {
      const div = document.createElement('div');
      div.className = "bg-[#111] p-4 rounded shadow-md flex flex-col items-center";
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}" class="product-img mb-4">
        <h3 class="text-xl font-semibold">${product.name}</h3>
        <p class="text-lg">$${product.price.toFixed(2)}</p>
        <button onclick='addToCart(${JSON.stringify(product)})' class="mt-3 bg-green-600 hover:bg-green-800 text-white px-4 py-2 rounded">Add to Cart</button>
      `;
      productList.appendChild(div);
    });

    function addToCart(product) {
      if (localStorage.getItem('loggedIn') !== 'true') {
        alert("Please login to add items to cart.");
        window.location.href = "login.html";
        return;
      }

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${product.name} added to cart!`);
    }
  </script>
</body>
</html>
