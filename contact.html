<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact |  PRABU  ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: black;
      background-image: url('bg3.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="bg-black bg-opacity-80 p-4 sticky top-0 z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Suriya ShopCart</h1>
      <nav class="space-x-4">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
        <a href="overview.html">Overview</a>
      </nav>
    </div>
  </header>

  <!-- Contact Form -->
  <main class="container mx-auto px-4 py-10">
    <h2 class="text-4xl font-bold mb-6 text-center">Contact Us</h2>
    <form class="bg-[#111] p-6 rounded max-w-xl mx-auto space-y-4">
      <div>
        <label class="block mb-1">Your Name</label>
        <input type="text" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600" required>
      </div>
      <div>
        <label class="block mb-1">Email Address</label>
        <input type="email" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600" required>
      </div>
      <div>
        <label class="block mb-1">Message</label>
        <textarea rows="4" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600" required></textarea>
      </div>
      <button type="submit" class="bg-red-600 hover:bg-red-800 text-white px-4 py-2 rounded">Send Message</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-black bg-opacity-80 text-white text-center py-4 mt-auto">
    &copy; 2025 Suriya ShopCart. All rights reserved.
  </footer>

</body>
</html>
