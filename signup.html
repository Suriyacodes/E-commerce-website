<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up |  PRABU ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">

  <div class="bg-[#111] p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center">Create Account</h2>
    <input id="signup-username" type="text" placeholder="Username" class="w-full mb-4 p-2 rounded bg-black border border-white text-white">
    <input id="signup-password" type="password" placeholder="Password" class="w-full mb-4 p-2 rounded bg-black border border-white text-white">
    <button onclick="signup()" class="w-full bg-red-600 hover:bg-red-800 text-white py-2 rounded">Sign Up</button>
    <p class="text-sm mt-4 text-center">Already have an account? <a href="login.html" class="text-red-400 underline">Login</a></p>
  </div>

  <script>
    function signup() {
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value.trim();
      if (!username || !password) return alert('Fill in both fields');

      localStorage.setItem('user', JSON.stringify({ username, password }));
      alert('Signup successful! You can now log in.');
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
