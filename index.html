<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home | PRABU ShopCart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: black;
      background-image: url('bg2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="text-white flex flex-col min-h-screen">


  <header class="bg-black bg-opacity-80 p-4 sticky top-0 z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Suriya ShopCart</h1>
      <nav class="space-x-4">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
        <a href="overview.html">Overview</a>
        <span id="auth-links" class="ml-4"></span>
      </nav>
    </div>
  </header>


  <div id="welcome" class="text-right px-6 py-2 text-white"></div>

 
  <main class="flex-grow flex items-center justify-center text-center">
    <div class="bg-black bg-opacity-70 p-10 rounded-lg animate-fade-in">
      <h2 class="text-5xl font-bold mb-4">Welcome to Suriya ShopCart 🛒</h2>
      <p class="text-xl">Experience the best products with a sleek look.</p>
    </div>
  </main>


  <footer class="bg-black bg-opacity-80 text-white text-center py-4">
    &copy; 2025 Suriya ShopCart. All rights reserved.
  </footer>

  <script>
    const user = localStorage.getItem('loggedUser');
    const authLinks = document.getElementById('auth-links');
    const welcome = document.getElementById('welcome');

    if (localStorage.getItem('loggedIn') === 'true' && user) {
      welcome.innerHTML = `👋 Welcome, <strong>${user}</strong>`;
      authLinks.innerHTML = `<button onclick="logout()" class="bg-red-600 px-3 py-1 rounded hover:bg-red-800">Logout</button>`;
    } else {
      authLinks.innerHTML = `
        <a href="login.html" class="text-red-400 underline">Login</a>
        <a href="signup.html" class="text-red-400 underline ml-2">Sign Up</a>
      `;
    }

    function logout() {
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('loggedUser');
      location.reload();
    }
  </script>
</body>
</html>
